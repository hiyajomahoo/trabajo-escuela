services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 8f7f&GuH]Pn:EpS,LA*Wf8s;
      MYSQL_DATABASE: escuela
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./escuela.sql:/docker-entrypoint-initdb.d/escuela.sql:ro
    networks:
      - app-network

  # Node.js Backend Service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nodejs_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      SECRET_KEY: "1e9a7cfa668df593c5b29527f1e55c05"
      DB_HOST: "mysql"
      DB_NAME: "escuela"
      DB_PASSWORD: "8f7f&GuH]Pn:EpS,LA*Wf8s;"
    depends_on:
      - mysql
    volumes:
      - ./static:/app/static:ro  # Mount static files
    networks:
      - app-network

  # Nginx for serving static files (optional)
  nginx:
    image: nginx:alpine
    container_name: static_server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge